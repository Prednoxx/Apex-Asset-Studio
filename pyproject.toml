[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apex-asset-studio"
version = "0.3.1"
description = "Apex Legends model and animation exporter"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-or-later"}
dependencies = ["pyooz==0.0.8", "Pillow>=12.0,<13", "texture2ddecoder==1.0.6", "numpy==2.4.2", "PyOpenGL==3.1.10", "pyopengltk==0.0.4"]

[project.scripts]
apex-asset-studio = "apex_asset_studio.ui.app:main"
aas-diagnostics = "apex_asset_studio.diagnostics:main"

[tool.setuptools.package-data]
apex_asset_studio = ["resources/*", "resources/fonts/*"]

[tool.setuptools.packages.find]
include = ["apex_asset_studio*"]
